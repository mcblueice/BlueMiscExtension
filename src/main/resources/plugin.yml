name: BlueMiscExtension
version: '${project.version}'
main: net.mcblueice.bluemiscextension.BlueMiscExtension
api-version: 1.21.11
depend:
  - BlueLib
softdepend:
  - packetevents
  - PlaceholderAPI
  - floodgate
  - HuskSync
libraries:
  - com.zaxxer:HikariCP:7.1.0
folia-supported: true
author: Blue
description: 雜項擴展
commands:
  bluemiscextension:
    description: BlueMiscExtension主指令
    usage: /bluemiscextension <reload|debug|status|info|unlockdata|workbench|armorhide|sign>
    aliases: [bme]

permissions:
  bluemiscextension.reload:
    description: 允許使用 /bluemiscextension reload 指令
    default: op
  bluemiscextension.debug:
    description: 允許使用 /bluemiscextension debug 指令
    default: op
  bluemiscextension.status:
    description: 允許使用 /bluemiscextension status 指令
    default: op
  bluemiscextension.info:
    description: 允許使用 /bluemiscextension info 指令
    default: op
  bluemiscextension.unlockdata:
    description: 允許使用 /bluemiscextension unlockdata 指令
    default: op
  bluemiscextension.updateinv:
    description: 允許使用 /bluemiscextension updateinv 指令
    default: op
  bluemiscextension.portalbreak:
    description: 允許使用 /bluemiscextension portalbreak 指令
    default: op
  bluemiscextension.workbench:
    description: 允許使用 /bluemiscextension workbench 指令
    default: op
  bluemiscextension.workbench.other:
    description: 允許使用 /bluemiscextension workbench <workbench> <player> 指令
    default: op
  bluemiscextension.workbench.workbench:
    description: 允許使用 /bluemiscextension workbench workbench 指令
    default: op
  bluemiscextension.workbench.anvil:
    description: 允許使用 /bluemiscextension workbench anvil 指令
    default: op
  bluemiscextension.workbench.grindstone:
    description: 允許使用 /bluemiscextension workbench grindstone 指令
    default: op
  bluemiscextension.workbench.smithing:
    description: 允許使用 /bluemiscextension workbench smithing 指令
    default: op
  bluemiscextension.workbench.cartography:
    description: 允許使用 /bluemiscextension workbench cartography 指令
    default: op
  bluemiscextension.workbench.loom:
    description: 允許使用 /bluemiscextension workbench loom 指令
    default: op
  bluemiscextension.workbench.enderchest:
    description: 允許使用 /bluemiscextension workbench enderchest 指令
    default: op
  bluemiscextension.armorhide:
    description: 允許使用 /bluemiscextension armorhide 指令
    default: op
  bluemiscextension.armorhide.other:
    description: 允許使用 /bluemiscextension armorhide <player> 指令
    default: op
  bluemiscextension.phantom:
    description: 允許使用 /bluemiscextension phantom 指令
    default: op
  bluemiscextension.phantom.other:
    description: 允許使用 /bluemiscextension phantom <player> 指令
    default: op
  bluemiscextension.shulkerbox.open.hand:
    description: 允許玩家以手持方式開啟界伏盒
    default: op
  bluemiscextension.shulkerbox.open.inventory:
    description: 允許玩家以背包方式開啟界伏盒
    default: op
  bluemiscextension.lightblock:
    description: 允許生存模式使用光源方塊
    default: op
  bluemiscextension.nick:
    description: 允許使用 /bluemiscextension nick 指令
    default: op
  bluemiscextension.nick.other:
    description: 允許使用 /bluemiscextension nick <player> 指令
    default: op
  bluemiscextension.nick.basiccolor:
    description: 允許使用基本顏色作為暱稱顏色
    default: op
  bluemiscextension.nick.hexcolor:
    description: 允許使用十六進制顏色作為暱稱顏色
    default: op
  bluemiscextension.itemsign:
    description: 允許使用 /bluemiscextension sign 為手上物品署名
    default: op
  bluemiscextension.itemsign.override:
    description: 允許覆寫或略過他人署名限制
    default: op
  bluemiscextension.clickthrough:
    description: 允許點擊穿過告示牌與展示框
    default: op